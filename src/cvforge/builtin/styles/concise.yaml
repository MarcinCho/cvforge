name: concise
description: Tight and scannable. Short bullets, minimal adjectives, fits easily on one page.
instructions: |
  - Maximum ~15 words per bullet; one fact per bullet.
  - Recent relevant role: 4-6 bullets; older roles: 1 bullet.
  - Summary: 2-3 short sentences.
  - Plain, neutral wording; no adjectives unless they carry information.
