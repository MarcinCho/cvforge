name: impact
description: Results-first. Every bullet leads with a measurable outcome where the source has one.
instructions: |
  - Lead bullets with the result, then how it was achieved ("Cut on-site setup time by 50% by scripting...").
  - Prefer bullets that carry a metric from the source; keep the exact numbers.
  - Confident, active voice; no filler adjectives ("dynamic", "passionate").
  - Summary opens with years/scope of experience and the single most impressive, job-relevant result.
